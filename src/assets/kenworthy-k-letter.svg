<!--
  DERIVED ARTWORK — do not hand-edit, and do not treat as a source of truth.

  This is the "K" letterform on its own, lifted from kenworthy-k.svg. In that
  file the letter is not a shape at all: the arch is one path of two subpaths
  under fill-rule="evenodd", so the K is the *hole* punched in it. That is why
  it cannot be addressed with CSS from the original — a mask can select a file,
  not a subpath — and why this file exists.

  How it was produced: take the first <path> of kenworthy-k.svg (the arch,
  bbox 63.3,71.3 85.8x112), split its "d" on absolute movetos, and keep the
  second subpath (bbox 81.9,85 50.4x88.4 — the smaller, contained one). The
  viewBox is copied unchanged so this overlays the original exactly with no
  transform.

  If kenworthy-k.svg is ever redrawn, this does not follow it. Regenerate it,
  and check the result against the original at size — a silently stale K would
  show up as a letter that no longer fits its own arch.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212.4 189.8">
  <path fill="#414042" fill-rule="evenodd" d="M94.2,138.4h21.8v35h14.1v-35.3c0-1.1-.1-2.2-.3-3.3-1.4-7.2-7.1-11.9-14.6-11.6-2.9.1-5.8,0-9,0,8.8-12.8,17.3-25.4,26.1-38.2-5.5,0-10.7,0-15.8,0-.4,0-.9.4-1.1.7-2.6,3.8-5.1,7.6-7.7,11.4-3.1,4.7-6.2,9.4-9.4,14.1-1.2,1.8-2.5,3.7-3.7,5.5-.1,0-.3,0-.4-.1v-31.5h-12.3v88.3h12.3v-35h0Z"/>
</svg>
